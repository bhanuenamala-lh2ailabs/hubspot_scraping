[project]
name = "shutdown-radar"
version = "1.0.0"
description = "Deduplicated, confidence-scored list of Indian companies that shut down since 2024-01-01"
requires-python = ">=3.11"
dependencies = [
  "httpx", "pydantic", "typer", "feedparser", "rapidfuzz", "pdfplumber",
  "openpyxl", "dnspython", "tenacity", "python-dateutil", "rich",
]

[project.scripts]
shutdown-radar = "shutdown_radar.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
