name: Deploy Sales Dashboard

on:
  workflow_dispatch: {}          # run manually anytime
  schedule:
    - cron: "0 * * * *"          # refresh hourly (UTC). Change or remove as needed.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pull fresh HubSpot data
        env:
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
        run: python build_dashboard.py

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp dashboard_data.json _site/dashboard_data.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
